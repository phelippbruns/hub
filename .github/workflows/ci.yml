name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, testes e auditoria
    runs-on: ubuntu-latest
    # 20 min não davam mais conta: a suíte de jornadas cresce a cada feature,
    # e numa rodada o `playwright install` sozinho levou 10 dos 20 minutos.
    # O cache abaixo ataca a causa; a folga aqui é para o dia em que o cache
    # falhar não derrubar um PR que está certo.
    timeout-minutes: 35

    env:
      # Endereços do Supabase local do CLI. As chaves não ficam aqui: são
      # lidas do próprio CLI depois que ele sobe (passo "Chaves do Supabase
      # local"). Chumbar chave em workflow é hábito ruim mesmo quando o valor
      # é público, e o verificador de segredos do GitHub recusa o push.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      # Valores de partida, só para a validação do lib/env.ts passar nos passos
      # que rodam antes do Supabase subir (tipos, lint, testes de unidade).
      SUPABASE_SECRET_KEY: definido-depois
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: definido-depois
      # RN29: as jornadas precisam concluir um cadastro, e o verificador real
      # ainda não existe. `lib/env.ts` só aceita isto com Supabase local.
      AGE_VERIFIER: self_declared

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # O postinstall roda `prisma generate`: sem isso não há cliente, porque
      # prisma/generated não vai para o repositório.
      - name: Instalar dependências
        run: npm ci

      # Os tokens são gerados do JSON: se o gerado divergir, a CI acusa.
      - name: Tokens em dia com o design system
        run: npm run tokens:check

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Testes de unidade
        run: npm run test

      # Índice único, gatilho e RLS não existem em dublê: estes testes precisam
      # de um Postgres de verdade. O CLI do Supabase sobe o banco e o schema
      # auth, de que as políticas dependem (auth.uid()).
      - name: Subir o Supabase local
        # O mailpit fica de pé: as jornadas de autenticação leem o código de
        # recuperação na caixa de entrada, como a pessoa faria.
        # `storage-api` **precisa** subir: desde a F09 a resposta aceita
        # imagem, e sem o serviço de arquivos o envio falha só aqui — a
        # máquina de quem desenvolve tem tudo ligado. `imgproxy` fica de
        # fora porque é transformação de imagem, recurso pago que não usamos.
        run: npx supabase start -x imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta

      # O CLI imprime as chaves do ambiente local; lê-las daqui evita escrever
      # qualquer coisa parecida com segredo dentro do repositório.
      - name: Chaves do Supabase local
        run: |
          status=$(npx supabase status -o json)
          echo "SUPABASE_SECRET_KEY=$(echo "$status" | jq -r .SECRET_KEY)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(echo "$status" | jq -r .PUBLISHABLE_KEY)" >> "$GITHUB_ENV"

      - name: Migrations do zero
        run: npm run db:deploy

      - name: Seed
        run: npm run db:seed

      - name: Testes de banco, regras e RLS
        run: npm run test:db

      # O navegador são ~150 MB baixados, e `--with-deps` ainda roda apt.
      # Sem cache isso variou de 1 a 10 minutos entre rodadas, e os 10
      # minutos comeram o tempo das jornadas até o job estourar o limite.
      # A chave é a versão do Playwright, que é o que decide qual navegador
      # serve: o `package-lock.json` muda por qualquer dependência.
      - name: Cache do navegador do Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar navegador do Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Com o navegador em cache, faltam só as bibliotecas do sistema. É
      # rápido quando já estão lá, e é o que impede o cache de esconder uma
      # imagem de runner que mudou.
      - name: Bibliotecas do sistema para o navegador
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Testes de jornada
        run: npm run test:e2e

      # Regra de segurança 9: pull request não passa com vulnerabilidade alta.
      # O gate bloqueante olha as dependências de produção, que são as que
      # chegam ao usuário.
      - name: Auditoria de dependências (produção)
        run: npm audit --audit-level=high --omit=dev

      # A árvore completa inclui dev-dependencies. Hoje o ESLint do Next puxa
      # braces/micromatch, com um aviso alto e sem versão corrigida publicada
      # (GHSA-vfj7-8cjw-p6xm). Este passo deixa o aviso visível no log sem
      # travar o time; reavaliar quando o upstream publicar correção.
      - name: Auditoria de dependências (árvore completa, informativa)
        run: npm audit --audit-level=high
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
