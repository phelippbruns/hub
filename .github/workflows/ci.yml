name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, testes e auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Valores sintéticos: nada aqui conecta a um banco de verdade, mas a
      # validação Zod de lib/env.ts roda no build e exige que existam.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      SUPABASE_SECRET_KEY: ci-service-role-key
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-anon-key

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # O postinstall roda `prisma generate`: sem isso não há cliente, porque
      # prisma/generated não vai para o repositório.
      - name: Instalar dependências
        run: npm ci

      # Os tokens são gerados do JSON: se o gerado divergir, a CI acusa.
      - name: Tokens em dia com o design system
        run: npm run tokens:check

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Testes de unidade
        run: npm run test

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de jornada
        run: npm run test:e2e

      # Regra de segurança 9: pull request não passa com vulnerabilidade alta.
      # O gate bloqueante olha as dependências de produção, que são as que
      # chegam ao usuário.
      - name: Auditoria de dependências (produção)
        run: npm audit --audit-level=high --omit=dev

      # A árvore completa inclui dev-dependencies. Hoje o ESLint do Next puxa
      # braces/micromatch, com um aviso alto e sem versão corrigida publicada
      # (GHSA-vfj7-8cjw-p6xm). Este passo deixa o aviso visível no log sem
      # travar o time; reavaliar quando o upstream publicar correção.
      - name: Auditoria de dependências (árvore completa, informativa)
        run: npm audit --audit-level=high
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
