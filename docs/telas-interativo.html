<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub: telas finais, celular e web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E1A33;--inkMuted:#565170;--paper:#FFFFFF;--surfacePage:#F1EEFF;--lavender:#A69CFB;--sun:#FFD95E;--line:#D4CEF2;
  --error:#B42318;--success:#146C43;
  --space1:4px;--space2:8px;--space3:16px;--space4:24px;--radiusSm:12px;--radiusMd:18px;--radiusPill:999px;
  --font:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --c-bg:#F6F5F9;--c-line:#DDD9E6;--c-mute:#5B5768;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--c-bg);color:var(--ink);font-family:var(--font);line-height:1.4}
button,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* ===== chrome ===== */
.app{display:grid;grid-template-columns:270px 1fr;min-height:100%}
@media (max-width:900px){.app{grid-template-columns:1fr}}
.side{border-right:1px solid var(--c-line);padding:calc(16px + env(safe-area-inset-top,0px)) 14px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--c-bg)}
@media (max-width:900px){.side{position:static;height:auto;max-height:240px;border-right:0;border-bottom:1px solid var(--c-line)}}
.side h1{font-size:18px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
.side .sub{font-size:13px;color:var(--c-mute);margin:0 0 14px}
.grp{margin:14px 0 4px;font-size:13px;font-weight:700;color:var(--c-mute)}
.side button.item{display:flex;width:100%;text-align:left;gap:8px;align-items:baseline;border:0;background:transparent;padding:6px 8px;border-radius:10px;cursor:pointer;font-size:14px}
.side button.item .n{color:var(--c-mute);font-variant-numeric:tabular-nums;min-width:20px}
.side button.item .cnt{margin-left:auto;font-size:12px;color:var(--c-mute)}
.side button.item .cnt.full{color:var(--success);font-weight:700}
.side button.item[aria-current="page"]{background:var(--ink);color:var(--paper)}
.side button.item[aria-current="page"] .n,.side button.item[aria-current="page"] .cnt{color:#D8D4E6}
.main{padding:calc(20px + env(safe-area-inset-top,0px)) clamp(16px,3vw,36px) calc(32px + env(safe-area-inset-bottom,0px));min-width:0}
.head h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.head p{margin:4px 0 18px;color:var(--c-mute);max-width:72ch}
.work{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
@media (max-width:1180px){.work{grid-template-columns:1fr}}
.stage{background:#E9E6F2;border-radius:20px;padding:24px 12px;display:flex;gap:24px;justify-content:center;flex-wrap:wrap;overflow-x:auto}
.cap{font-size:12px;font-weight:700;color:var(--c-mute);text-align:center;margin-bottom:8px}
.points{display:flex;flex-direction:column;gap:12px}
.points h3{margin:0;font-size:16px}
.pt{background:var(--paper);border:1.5px solid var(--c-line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pt.done{border-color:var(--ink)}
.pt p{margin:0;font-size:14px}
.pt p b{font-weight:700}
.acts{display:flex;gap:8px}
.acts button{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer}
.acts button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pt textarea{width:100%;min-height:52px;border:1.5px solid var(--c-line);border-radius:10px;padding:8px;font-size:13px;resize:vertical;background:var(--paper)}
.pager{display:flex;justify-content:space-between;margin-top:20px}
.pager button,.copy{border:1.5px solid var(--ink);background:transparent;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer}
.pager button:disabled{opacity:.3;cursor:default}
.copy{background:var(--ink);color:var(--paper)}
.sum{background:var(--paper);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.sum h4{margin:0;font-size:15px}
.sum ol{margin:4px 0 0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.tagv{font-weight:700}.tagv.a{color:var(--success)}.tagv.r{color:var(--error)}.tagv.p{color:var(--c-mute);font-weight:500}

/* ===== telefone e componentes do Hub ===== */
.ph{width:300px;height:620px;flex:none;background:var(--surfacePage);border:7px solid #15121F;border-radius:34px;overflow:hidden;display:flex;flex-direction:column;position:relative;font-size:14px}
.hd{display:flex;align-items:center;gap:6px;padding:16px 14px 8px}
.hd .t{flex:1;font-weight:800;font-size:21px;line-height:1.1;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .t.s{font-size:17px}
.ib{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;position:relative;flex:none}
.ib .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 2px var(--surfacePage)}
.bd{flex:1;overflow:hidden;padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px}
.ico{width:22px;height:22px;display:block;flex:none}
.ico.sm{width:16px;height:16px}
.st{font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.st a{font-size:12px;font-weight:600;color:var(--ink);text-decoration:underline}
.mu{color:var(--inkMuted)}
.xs{font-size:12px;line-height:16px}
.qc{background:var(--ink);color:var(--paper);border-radius:var(--radiusMd);padding:14px;display:flex;flex-direction:column;gap:10px}
.qc .meta{font-size:12px;display:flex;justify-content:space-between;gap:8px;opacity:.9}
.qc .q{font-weight:800;font-size:19px;line-height:1.15;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:var(--radiusPill);padding:10px 18px;font-weight:600;font-size:14px;background:var(--ink);color:var(--paper);cursor:pointer;align-self:flex-start}
.btn.sec{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.rit{background:var(--sun);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.full{align-self:stretch}
.btn.off{background:#CFCBDB;color:var(--inkMuted)}
.card{background:var(--paper);border-radius:var(--radiusSm);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.who{display:flex;gap:8px;align-items:center;font-size:12px}
.who b{font-size:13px}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;overflow:hidden;flex:none}
.av svg{width:100%;height:100%}
.av.lg{width:72px;height:72px}
.av.md{width:40px;height:40px}
.p1{background:#CFC7FF;color:#7E70E8}.p2{background:#FFE9A3;color:#C99A12}.p3{background:#BFE7D3;color:#3E8E68}.p4{background:#F8C9C2;color:#B5584A}
.stack{display:flex}.stack .av{box-shadow:0 0 0 2px var(--surfacePage)}.stack .av+.av{margin-left:-8px}
.acts2{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--inkMuted)}
.acts2 span{display:inline-flex;gap:4px;align-items:center}
.row{display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:var(--radiusSm);padding:10px}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g{color:var(--inkMuted);font-weight:800}
.mk{width:32px;height:32px;border-radius:var(--radiusSm);display:inline-grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.m1{background:var(--sun);color:var(--ink)}.m2{background:var(--lavender);color:var(--ink)}.m3{background:var(--ink);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:var(--radiusSm);padding:7px 11px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--inkMuted);font-size:13px;font-weight:600;display:inline-flex;gap:5px}
.chip.on{background:var(--lavender);box-shadow:none}
.chip.on::before{content:"✓";font-weight:800}
.seg{display:flex;background:var(--paper);border-radius:var(--radiusPill);padding:3px;gap:3px}
.seg span{flex:1;text-align:center;padding:6px 4px;border-radius:var(--radiusPill);font-size:12px;font-weight:600}
.seg span.on{background:var(--ink);color:var(--paper)}
.fld{background:var(--paper);border-radius:var(--radiusSm);box-shadow:inset 0 0 0 1px var(--inkMuted);padding:10px 12px;font-size:13px;color:var(--inkMuted);display:flex;gap:8px;align-items:center}
.fld.tall{min-height:84px;align-items:flex-start}
.fld.typed{color:var(--ink)}
.fld.bad{box-shadow:inset 0 0 0 2px var(--error)}
.lab{font-size:12px;font-weight:700;color:var(--inkMuted);margin-bottom:-4px}
.cnt{font-size:11px;color:var(--inkMuted);text-align:right;margin-top:-6px}
.msg{font-size:12px;display:flex;gap:6px;align-items:flex-start;border-radius:10px;padding:8px 10px}
.msg.err{background:#FCE8E6;color:var(--error)}
.msg.ok{background:#E3F3EA;color:var(--success)}
.msg.info{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.ban{background:var(--sun);border-radius:var(--radiusMd);padding:12px;display:flex;flex-direction:column;gap:4px}
.ban b{font-size:15px}
.prov{display:inline-block;font-size:10px;font-weight:700;border-radius:999px;padding:1px 7px;box-shadow:inset 0 0 0 1px currentColor;vertical-align:middle;margin-left:4px}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--sun);color:var(--ink)}
.pill.l{background:var(--lavender)}
.pill.o{background:transparent;box-shadow:inset 0 0 0 1px var(--inkMuted);color:var(--inkMuted)}
.bub{max-width:80%;padding:8px 12px;border-radius:16px;font-size:13px}
.bub.them{background:var(--paper);align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{background:var(--lavender);align-self:flex-end;border-bottom-right-radius:4px}
.bub small{display:block;font-size:10px;font-weight:700;color:var(--inkMuted)}
.compose{display:flex;gap:6px;align-items:center;padding:8px 10px 12px;background:var(--surfacePage)}
.compose .fld{flex:1;border-radius:999px;padding:8px 12px}
.nav{display:flex;justify-content:space-around;background:var(--paper);border-top:2px solid var(--ink);padding:7px 2px 9px}
.nav span{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--inkMuted);min-width:60px}
.nav span.on{color:var(--ink);font-weight:700}
.cover{height:96px;background:var(--lavender);border-radius:var(--radiusMd);position:relative;overflow:hidden}
.cover::after{content:"#";position:absolute;right:-6px;bottom:-34px;font-size:150px;font-weight:800;color:var(--ink);opacity:.18}
.ov{position:absolute;inset:0;background:rgba(30,26,51,.5);display:flex;align-items:flex-end}
.sh{background:var(--paper);border-radius:22px 22px 0 0;padding:16px;width:100%;display:flex;flex-direction:column;gap:10px}
.sh .grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.radio{display:flex;gap:10px;align-items:center;font-size:13px;padding:6px 0}
.radio i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--inkMuted);flex:none}
.radio.on i{box-shadow:inset 0 0 0 5px var(--ink)}
.box{width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 2px var(--inkMuted);display:inline-grid;place-items:center;flex:none}
.box.on{background:var(--ink);box-shadow:none;color:var(--paper)}
.tg{width:40px;height:24px;border-radius:999px;background:#CFCBDB;position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--paper)}
.tg.on{background:var(--ink)}.tg.on::after{left:19px}
.skel{background:#E2DCFF;border-radius:8px}
.lines span{display:block;height:8px;border-radius:4px;background:var(--line);margin:7px 0}
.steps{display:flex;gap:4px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--ink)}
.excerpt{background:var(--paper);border-radius:var(--radiusSm);padding:12px;font-size:14px;line-height:1.45}
.statesheet{width:min(100%,640px);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;font-family:var(--font)}
.statesheet .stc{background:var(--surfacePage);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.statesheet .stc h5{margin:0;font-size:12px;color:var(--inkMuted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.chn{font-weight:800;font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row.col{flex-direction:column;align-items:flex-start;gap:2px}
.row b.wrap{white-space:normal}
.sorts{display:flex;gap:2px;background:var(--paper);border-radius:999px;padding:3px;flex:none}
.sorts span{width:30px;height:26px;border-radius:999px;display:grid;place-items:center;color:var(--inkMuted)}
.sorts span.on{background:var(--ink);color:var(--paper)}
.btn.ic{width:42px;height:42px;padding:0;background:var(--lavender);color:var(--ink)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs span{flex:1;text-align:center;padding:8px 4px;font-size:13px;font-weight:600;color:var(--inkMuted)}
.tabs span.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.end{text-align:center;font-size:12px;color:var(--inkMuted);padding:6px 0;border-top:1px dashed var(--line)}
.dest{background:var(--ink);color:var(--paper);border-radius:var(--radiusMd);padding:14px;display:flex;flex-direction:column;gap:8px}
.dest .q{font-weight:800;font-size:18px;line-height:1.15;letter-spacing:-.02em}
.dest .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:8px}
.ans{background:var(--paper);border-radius:var(--radiusSm);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.ans .foot{display:flex;gap:12px;font-size:12px;color:var(--inkMuted);align-items:center}
.ans .foot span{display:inline-flex;gap:4px;align-items:center}
.vt{display:inline-flex;background:var(--paper);border:1.5px solid var(--c-line);border-radius:999px;padding:3px;gap:3px;margin-bottom:10px}
.vt button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer}
.vt button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.work.wide{grid-template-columns:1fr}
.stage{justify-content:flex-start}
@media (min-width:1px){.stage>div{margin:0 auto}}
.web{width:940px;height:600px;flex:none;border:7px solid #15121F;border-radius:18px;overflow:hidden;background:var(--surfacePage);display:flex;flex-direction:column;font-size:14px}
.wtop{height:30px;background:#15121F;display:flex;align-items:center;gap:6px;padding:0 10px;flex:none}
.wtop i{width:9px;height:9px;border-radius:50%;background:#4A4560}
.wtop span{margin-left:12px;background:#2A2640;color:#BDB8D0;font-size:11px;border-radius:6px;padding:3px 10px;flex:1;max-width:340px}
.wgrid{flex:1;display:grid;grid-template-columns:200px minmax(0,1fr) 260px;min-height:0}
.wgrid.noaside{grid-template-columns:200px minmax(0,1fr)}
.wnav{background:var(--paper);border-right:2px solid var(--ink);padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.wnav .logo{font-weight:800;font-size:26px;letter-spacing:-.03em;padding:0 8px 12px}
.wnav span{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:999px;color:var(--inkMuted);font-weight:600}
.wnav span.on{background:var(--ink);color:var(--paper)}
.wdot{width:8px;height:8px;border-radius:50%;background:var(--sun);margin-left:auto}
.wmain{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;overflow:hidden}
.wmain .hd{padding:18px 24px 8px}
.wmain .bd{padding:4px 24px 16px;width:100%;max-width:600px}
.wmain .compose{padding:8px 24px 14px;max-width:600px}
.waside{border-left:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.web .ov{align-items:center;justify-content:center}
.web .sh{border-radius:18px;max-width:380px}
.web .sh .grab{display:none}
.web .wonly{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--paper);border-radius:var(--radiusSm);height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.stats b{font-size:18px;line-height:1;font-weight:800}
.stats span{font-size:11px;color:var(--inkMuted);white-space:nowrap}
.ib.gif{font-size:11px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);width:34px;height:26px;border-radius:8px}
.opening{background:var(--ink);color:var(--paper);border-radius:var(--radiusMd);padding:14px;display:flex;flex-direction:column;gap:6px}
.opening .q{font-weight:800;font-size:18px;line-height:1.15;letter-spacing:-.02em}
.wgrid.bare{grid-template-columns:1fr}.wgrid.bare .wmain{background:var(--surfacePage)}
.hero{height:190px;position:relative;flex:none;background:
 radial-gradient(circle at 72% 30%,#FFD95E 0 18px,transparent 19px),
 linear-gradient(170deg,transparent 58%,#2B2350 58.5%),
 linear-gradient(195deg,transparent 64%,#3D3170 64.5%),
 linear-gradient(180deg,#8E7CF5 0%,#C9B8FF 45%,#FFB38A 70%)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,26,51,.35) 0%,transparent 35%,transparent 55%,rgba(30,26,51,.75) 100%)}
.hero .hb{position:absolute;top:10px;z-index:2;background:rgba(255,255,255,.92);color:var(--ink)}
.hero .htitle{position:absolute;left:14px;bottom:12px;z-index:2;color:var(--paper);font-weight:800;font-size:24px;letter-spacing:-.02em}
.web .hero{height:200px}
.pend{width:12px;height:12px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 2px var(--ink);flex:none;margin-right:4px}
.chip.u.on{background:var(--sun)}
.chip.c.on{background:var(--lavender)}
.people{display:flex;gap:12px;overflow:hidden}
.people span{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none}
.people i{font-style:normal;font-size:10px;color:var(--inkMuted)}
.ib.eye{box-shadow:inset 0 0 0 1.5px var(--ink)}
.ib.eye.on{background:var(--ink);color:var(--paper)}
.ib.eye.on .ico circle{fill:var(--ink)}
.tabs span .ico{display:inline-block;vertical-align:-3px}
.nav span{min-width:48px;padding:4px 0}
.ib.eye{box-shadow:inset 0 0 0 1.5px var(--inkMuted);color:var(--inkMuted)}
.ib.eye.on{background:var(--lavender);color:var(--ink);box-shadow:none}
.eyesm{color:var(--inkMuted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .btn{align-self:stretch;width:100%}
.btn.fol{background:var(--sun);color:var(--ink)}
.pair{grid-template-columns:auto auto;justify-content:start;gap:6px}
.pair .btn{width:auto;padding:5px 12px;font-size:12px}
.pair .btn .ico{width:14px;height:14px}
.stats{gap:6px}
.stats div{height:44px;gap:1px}
.stats b{font-size:15px}
.stats span{font-size:10px}
.common{display:flex;flex-direction:column;gap:4px}
.chips.sm .chip{padding:3px 8px;font-size:11px}
.hero .door{position:absolute;right:12px;bottom:12px;z-index:2;background:var(--paper);color:var(--ink)}
.hero .door.in{background:var(--lavender)}
.hero .htitle{right:120px}
.hero .door{width:40px;height:40px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;cursor:pointer}
.thumb{width:36px;height:36px;border-radius:10px;flex:none;position:relative;overflow:hidden}
.thumb.t1{background:radial-gradient(circle at 70% 30%,#FFD95E 0 4px,transparent 5px),linear-gradient(165deg,transparent 60%,#2B2350 61%),linear-gradient(180deg,#8E7CF5,#FFB38A)}
.thumb.t2{background:linear-gradient(160deg,transparent 55%,#3E6B4F 56%),linear-gradient(200deg,transparent 62%,#5C8A6B 63%),linear-gradient(180deg,#9CC7E8,#E8F1D6)}
.thumb.t3{background:radial-gradient(circle at 30% 30%,#F1EEFF 0 3px,transparent 4px),linear-gradient(180deg,#1E1A33,#6B1F2A)}

   <div class="lockmsg">${ic('lock')}<b>112 respostas de 86 pessoas</b><div class="inv"><button class="btn">Criar conta para ver as respostas</button><button class="btn sec">Entrar</button></div></div></div>`;
  const mobB=`<div class="hero" style="height:150px"><div class="htitle">Música Eletrônica</div></div>
  <div class="xs mu">Compartilhado por @liasouza</div>
  <div style="display:flex;align-items:center;gap:8px">${mk(2,'#')}<span class="xs"><b>3.412 membros</b></span></div>
  <div class="opening"><span class="xs" style="opacity:.85">${'*'}primeira festa</span><div class="q">${T1}</div></div>
  <div class="locked" style="min-height:140px"><div class="blurred">${ans(1,'Pessoa','há 5 min','Conteúdo disponível depois do cadastro, com texto de exemplo.')}</div>
   <div class="lockmsg">${ic('lock')}<b>112 respostas de 86 pessoas</b></div></div>
  <button class="btn full">Criar conta para ver as respostas</button>
  <div class="xs mu" style="text-align:center">Já tenho conta. <u>Entrar</u></div>`;
  return [{body:mobB,webBody:webB,wide:1}];},
 points:[]}

S.push(
{area:'Minha área',navKey:'perfil',aside:'',slug:'perfil/seguindo',title:'Pessoas que você segue',desc:'Lista aberta pelo link Seguindo, no perfil próprio, e por Ver todas, no Início. Só o dono vê.',
 states:()=>[{title:'Seguindo',back:1,small:1,nav:'perfil',body:`
  <div class="fld">${ic('search',false,'sm')}Buscar pessoas que você segue</div>
  <div class="xs mu">Só você vê esta lista.</div>
  ${[[1,'Lia Souza','@liasouza'],[3,'Jo Ramos','@joramos'],[2,'Caio Mendes','@caiomendes'],[4,'Bia Torres','@biatorres']].map(([n,a,h])=>`<div class="row">${av(n)}<div class="grow"><b>${a}</b><span class="xs mu">${h}</span></div><span class="ib eye on" role="button" aria-pressed="true" aria-label="Deixar de seguir ${a}">${ic('eye',false,'sm')}</span></div>`).join('')}`}],points:[]}
);
(function(){
  const wrap=(t,f)=>{const s=S.find(x=>x.title===t);const o=s.states;s.states=()=>o().map(f);};
  wrap('Tópico',x=>Object.assign(x,{aside:'',wide:1}));
  ['Perfil de outra pessoa','Perfil próprio'].forEach(t=>wrap(t,x=>Object.assign(x,{aside:'',center:720,cprof:1})));
  ['Editar perfil','Pessoas que você segue','Central de notificações','Moderação da comunidade'].forEach(t=>wrap(t,x=>Object.assign(x,{aside:'',center:720})));
  ['Início','Início vazio','Explorar comunidades','Resultado da busca','Página do Universo','Criar comunidade','Criar tópico'].forEach(t=>wrap(t,x=>Object.assign(x,{aside:'',center:720})));
  wrap('Explorar comunidades',x=>Object.assign(x,{webRight:''}));
  ['Minhas comunidades','Início'].forEach(t=>wrap(t,x=>{if(x.webBody){x.body=x.webBody;delete x.webBody;}return x;}));
  wrap('Denúncia e bloqueio',x=>Object.assign(x,{aside:'',wide:1}));
  wrap('Minhas comunidades',x=>Object.assign(x,{aside:'',center:720}));
  ['Resultado da busca','Página do Universo'].forEach(t=>wrap(t,x=>Object.assign(x,{nav:'explorar'})));
  wrap('Resultado da busca',x=>Object.assign(x,{title:'Explorar'}));
  wrap('Página da comunidade',x=>Object.assign(x,{aside:x.aside===''&&x.webOnly?'':ASIDE.com,wide:1}));
  ['Nova Cabine','Convite para Cabine','Lista de Cabines','Configurações','Termos e privacidade'].forEach(t=>wrap(t,x=>Object.assign(x,{aside:'',center:720})));
  wrap('Convite para Cabine',x=>Object.assign(x,{webBody:'<div class="invweb">'+x.body.replace(/<div style="flex:1"><\/div>/g,'').replace('<div style="height:56px;flex:none"></div>','')+'</div>'}));
})();
/* ===== pontos em aberto da versão final ===== */
const OPEN={
 'Criar comunidade':['<b>Valor provisório:</b> 20 membros para a comunidade aparecer em Explorar. Confirme ou defina outro número.'],
 'Tópico':['<b>Métrica registrada:</b> Afinidade passa a ser medida pelos acessos a perfis a partir de um tópico ou de uma resposta. O evento precisa registrar a origem do acesso. Isso precisa entrar na especificação técnica.'],
 'Convite para Cabine':['<b>Consequência:</b> sem prazo e com recusa silenciosa, quem convidou pode esperar para sempre. Proposta: quem convidou pode cancelar o convite, e convites pendentes contam no limite de 10 por dia.'],
 'Cadastro e verificação de idade':['<b>Atenção:</b> login com Google não substitui a verificação de idade. A data de nascimento da conta Google é informada pela própria pessoa, ou seja, é autodeclarada. A etapa de verificação continua obrigatória depois do login.','<b>Proposta:</b> o Google preenche nome e foto, e a pessoa pode trocar. A regra de identidade real continua valendo.'],
 'Moderação da comunidade':['<b>Regra de sucessão proposta:</b> quem cria a comunidade pode nomear outros moderadores. Se o criador sair, assume o moderador mais antigo. Sem moderadores, assume o membro mais antigo.']
};
S.forEach(s=>{s.points=[];});
/* ===== ordem da jornada ===== */
S.unshift({area:'',navKey:'',aside:'',slug:'',title:'Tela inicial',desc:'Primeira tela do app e da web, antes do login.',
 states:()=>[{body:`<div class="splash m">
   <div class="splashmid"><div style="display:flex;gap:8px;justify-content:center">${mk(1)}${mk(2,'#')}${mk(3,'*')}</div>
   <div style="font-weight:800;font-size:64px;line-height:.9;letter-spacing:-.04em">Hub</div>
   <div style="font-weight:700;font-size:18px;line-height:1.2">Conecte-se pelo que realmente importa.</div></div>
   <div class="splashbtns"><button class="btn full">Criar conta</button><button class="btn full sec">Entrar</button><div class="xs mu" style="text-align:center"><u>Termos e privacidade</u></div></div></div>`,
  webBody:`<div class="splash">
   <div class="splashmid"><div style="display:flex;gap:8px;justify-content:center">${mk(1)}${mk(2,'#')}${mk(3,'*')}</div>
   <div style="font-weight:800;font-size:88px;line-height:.9;letter-spacing:-.04em">Hub</div>
   <div style="font-weight:700;font-size:20px;line-height:1.2">Conecte-se pelo que realmente importa.</div></div>
   <div class="splashbtns"><button class="btn full">Criar conta</button><button class="btn full sec">Entrar</button><div class="xs mu" style="text-align:center"><u>Termos e privacidade</u></div></div></div>`,
  aside:''}],points:[]});

const ORDER=[
 ['Entrada / Onboarding',['Tela inicial','Convite por link','Cadastro e verificação de idade','Esqueci a senha','Onboarding']],
 ['Início / Feed',['Início','Início vazio','Central de notificações']],
 ['Descoberta / Explorar',['Explorar comunidades','Resultado da busca','Página do Universo']],
 ['Comunidades / Tópicos / Respostas',['Minhas comunidades','Criar comunidade','Página da comunidade','Tópico','Criar tópico']],
 ['Cabine',['Lista de Cabines','Nova Cabine','Convite para Cabine','Cabine']],
 ['Perfis',['Perfil próprio','Editar perfil','Pessoas que você segue','Perfil de outra pessoa','Configurações']],
 ['Segurança',['Denúncia e bloqueio','Moderação da comunidade','Termos e privacidade']],
 ['Sistema',['Estados do sistema']]
];
(function(){
  const by={};S.forEach(s=>by[s.title]=s);
  const out=[];
  ORDER.forEach(([area,titles])=>titles.forEach(t=>{const s=by[t];if(!s)throw new Error('tela ausente: '+t);s.area=area;out.push(s);delete by[t];}));
  if(Object.keys(by).length)throw new Error('telas fora da ordem: '+Object.keys(by).join(', '));
  S.length=0;out.forEach(s=>S.push(s));
  const c=S.find(s=>s.title==='Cadastro e verificação de idade');c.title='Login e cadastro';c.desc='Entrar com Google ou email. Na criação de conta, a verificação de idade continua obrigatória.';
})();
/* tela de login ganha o estado Entrar antes do cadastro */
(function(){
  const c=S.find(s=>s.title==='Login e cadastro');const orig=c.states;
  c.states=()=>[{cap:'Entrar',title:'Entrar',back:1,body:`
   <div class="lab">Email</div><div class="fld">seu@email.com</div>
   <div class="lab">Senha</div><div class="fld">••••••••</div>
   <div class="xs" style="text-align:right"><u>Esqueci a senha</u></div>
   <button class="btn full">Entrar</button>
   <div class="xs mu" style="text-align:center">ou</div>
   <button class="btn full sec">${ic('user',false,'sm')}Continuar com Google</button>
   <div class="xs mu" style="text-align:center">Não tem conta? <u>Criar conta</u></div>`}].concat(orig().map(o=>Object.assign(o,{cap:o.cap||'Criar conta'})));
})();

/* ===== telas aprovadas com ok ===== */
const APPROVED=['Tela inicial','Esqueci a senha','Onboarding','Início','Início vazio','Central de notificações','Explorar comunidades','Resultado da busca','Página do Universo','Minhas comunidades','Criar comunidade','Página da comunidade','Tópico','Criar tópico','Lista de Cabines','Nova Cabine','Convite para Cabine','Cabine','Perfil próprio','Editar perfil','Pessoas que você segue','Perfil de outra pessoa','Configurações','Denúncia e bloqueio','Termos e privacidade','Estados do sistema','Login e cadastro','Convite por link'];
/* ===== estado e render ===== */
const st={page:0,view:'cel',req:{}};
function menu(){
  let html='',last='';
  S.forEach((s,i)=>{
    if(s.area!==last){html+=`<div class="grp">${s.area}</div>`;last=s.area;}
    const txt=(st.req[i]||'').trim(),isOk=txt.toLowerCase()==='ok',pend=txt&&!isOk;
    const ready=isOk||(!txt&&APPROVED.includes(s.title));
    html+=`<button class="item" data-go="${i}" ${i===st.page?'aria-current="page"':''}><span class="n">${i+1}</span>${s.title}${pend?'<span class="cnt">pedido</span>':ready?'<span class="cnt ready" title="Aprovada">&lt;/&gt;</span>':''}</button>`;
  });
  html+=`<div class="grp">Fechamento</div><button class="item" data-go="${S.length}" ${st.page===S.length?'aria-current="page"':''}><span class="n">✓</span>Resumo dos pedidos</button>`;
  document.getElementById('menu').innerHTML=html;
  const n=Object.values(st.req).filter(v=>v&&v.trim()&&v.trim().toLowerCase()!=='ok').length;
  document.getElementById('progress').textContent=`Organizado por feature. ${n} de ${S.length} telas com pedido de mudança. Verde: aprovada com ok.`;
}
function stage(s){
  if(s.sheet) return starify(s.sheet());
  return starify(s.states().filter(o=>st.view==='web'||!o.webOnly).map(o=>st.view==='cel'?ph(o):web(o,s)).join(''));
}
function page(){
  const m=document.getElementById('main');
  if(st.page===S.length){
    const list=S.map((s,i)=>[i,s]).filter(([i])=>(st.req[i]||'').trim());
    m.innerHTML=`<div class="head"><h2>Resumo dos pedidos</h2><p>Copie e cole na conversa.</p></div>
     <div class="sum">${list.length?list.map(([i,s])=>`<div><h4>${i+1}. ${s.title}</h4><p style="margin:4px 0 0;white-space:pre-wrap;font-size:14px">${esc(st.req[i])}</p></div>`).join(''):'<p class="xs">Nenhum pedido ainda.</p>'}</div>
     <p><button class="copy" id="copy">Copiar resumo</button> <span id="copied" class="xs" aria-live="polite"></span></p>
     <div class="pager"><button data-go="${S.length-1}">Anterior</button><span></span></div>`;
    return;
  }
  const s=S[st.page],i=st.page;
  const toggle=s.sheet?'':`<div class="vt" role="group" aria-label="Versão"><button data-view="cel" aria-pressed="${st.view==='cel'}">Celular</button><button data-view="web" aria-pressed="${st.view==='web'}">Web</button></div>`;
  m.innerHTML=`<div class="head"><h2>${i+1}. ${s.title}</h2><p>${s.area}. ${s.desc}</p></div>
   <div class="work ${st.view==='web'&&!s.sheet?'wide':''}"><div><div class="stagebar">${toggle}</div><div class="stage">${stage(s)}</div></div>
   <section class="points" aria-label="Pedidos de mudança"><h3>Mudanças nesta tela</h3>
    <div class="pt"><textarea data-req="${i}" style="min-height:160px" placeholder="Descreva o que mudar nesta tela, no celular, na web ou nos dois" aria-label="Mudanças na tela ${esc(s.title)}">${esc(st.req[i]||'')}</textarea>
    <p class="xs" style="color:var(--c-mute)">O texto fica guardado enquanto esta página estiver aberta. Use "Resumo dos pedidos" para copiar tudo.</p></div>
   </section></div>
   <div class="pager"><button data-go="${i-1}" ${i===0?'disabled':''}>Anterior</button><button data-go="${i+1}">${i===S.length-1?'Ver resumo':'Próxima'}</button></div>`;
}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function summary(){
  const list=S.map((s,i)=>[i,s]).filter(([i])=>(st.req[i]||'').trim());
  return ['Hub: pedidos de mudança nas telas',''].concat(list.map(([i,s])=>`${i+1}. ${s.title}\n  ${st.req[i].trim().replace(/\n/g,'\n  ')}`)).join('\n');
}
function render(){menu();page();}
render();

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){st.page=Math.max(0,Math.min(S.length,+g.dataset.go));render();window.scrollTo(0,0);return;}
  const v=e.target.closest('[data-view]');
  if(v){st.view=v.dataset.view;page();return;}
  if(e.target.id==='copy'){
    const t=summary(),o=document.getElementById('copied'),ok=()=>o.textContent='Resumo copiado.';
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,()=>fb(t,ok));else fb(t,ok);
  }
});
document.addEventListener('input',e=>{const k=e.target.dataset.req;if(k!==undefined){st.req[k]=e.target.value;menu();}});
function fb(t,ok){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(err){document.getElementById('copied').textContent='Não foi possível copiar.';}ta.remove();}

</script>
</body>
</html>
