<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo Hub animado</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root { --ink:#1E1A33; --inkMuted:#565170; --paper:#FFFFFF; --surfacePage:#F1EEFF; --sun:#FFD95E;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,1,.36,1); }
* { box-sizing:border-box; }
body { margin:0; background:var(--surfacePage); color:var(--ink); font-family:"Bricolage Grotesque",system-ui,sans-serif; }
main { max-width:880px; margin:0 auto; padding:32px 16px 64px; }
h1 { font-size:28px; line-height:32px; font-weight:800; letter-spacing:-.02em; margin:0 0 8px; }
p { margin:0 0 32px; color:var(--inkMuted); font-size:15px; line-height:22px; }
.card { background:var(--paper); border-radius:18px; height:360px; display:grid; place-items:center; cursor:pointer; outline:none; }
.card:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
.lock { width:min(520px,100%); height:auto; overflow:visible; }
.bg { fill:var(--sun); }
path { fill:var(--ink); }
.icon, .brace { transform-box:fill-box; transform-origin:center; }
.text { transform-box:fill-box; transform-origin:0% 50%; }

/* repouso: só o ícone, centralizado */
.icon { transform:translateX(427.5px); transition:transform .45s var(--ease) .25s; }
.text { opacity:0; transform:translateX(-293.0px) scale(.04); transition:transform .3s var(--ease), opacity .1s linear .2s; }

/* hover: ícone desliza, a chave abre e "hub" sai de dentro dela */
.card:is(:hover,:focus-visible) .icon { transform:translateX(0); transition-delay:0s; }
.card:is(:hover,:focus-visible) .text { opacity:1; transform:none;
  transition:transform .65s var(--spring) .4s, opacity .05s linear .4s; }
.card:is(:hover,:focus-visible) .brace { animation:abre .8s var(--ease) .3s; }
@keyframes abre { 0%,100% { transform:scale(1); } 35% { transform:scale(1.2); } }

@media (prefers-reduced-motion:reduce) {
  .icon, .text, .brace { transition:none !important; animation:none !important; }
  .icon, .text { transform:none; opacity:1; }
}
</style>
</head>
